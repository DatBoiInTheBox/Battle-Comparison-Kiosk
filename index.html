<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mashup Brawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══ TOKENS ═══ */
:root{
  --bg:#0c1020;--bg2:#131a36;--card:#1a2247;--line:#2c3668;--chalk:#e9edf8;--dim:#8f9acb;
  --gold:#ffc83d;--curse:#b36bff;
  --p1:#ff6a3d;--p2:#3cc8ff;--p3:#b4f23c;--p4:#ff7ad9;
  --common:#8f9acb;--uncommon:#46d68a;--rare:#4aa8ff;--epic:#b980ff;--legendary:#ffc83d;--mythic:#ff5470;
  --disp:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{font-size:min(3.1vw,1.75vh)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--chalk);font-family:var(--body);font-weight:600;touch-action:manipulation;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 50% 0%,#1a2352 0%,transparent 60%),repeating-linear-gradient(115deg,transparent 0 3.4rem,rgba(255,255,255,.022) 3.4rem 3.55rem),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.d{font-family:var(--disp);font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:.95}
#particles{position:fixed;inset:0;pointer-events:none;z-index:50}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:.9rem;padding:calc(1.2rem + env(safe-area-inset-top)) 1.3rem calc(1.2rem + env(safe-area-inset-bottom))}
.c1{--c:var(--p1)}.c2{--c:var(--p2)}.c3{--c:var(--p3)}.c4{--c:var(--p4)}
.fill{flex:1;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;text-align:center;min-height:0}
.muted{color:var(--dim)}

/* ═══ BUTTONS ═══ */
.btn{background:var(--gold);color:#241a00;font-size:2.3rem;padding:1rem 2.8rem;border-radius:1rem;box-shadow:0 .4rem 0 #a97d00;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(.35rem);box-shadow:0 .05rem 0 #a97d00}
.btn.pc{background:var(--c);color:#14101a;box-shadow:0 .4rem 0 rgba(0,0,0,.45)}
.btn.pc:active{box-shadow:0 .05rem 0 rgba(0,0,0,.45)}
.btn.ghost{background:transparent;color:var(--dim);box-shadow:none;border:.18rem solid var(--line);font-size:1.5rem;padding:.65rem 1.8rem}
.btn.ghost:active{background:var(--line);transform:none}
.btn.sm{font-size:1.9rem;padding:.85rem 2.2rem}
.btn.red{background:#c0132a;color:#fff;box-shadow:0 .4rem 0 #7a0018}
.row-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;align-items:center}

/* ═══ TOP BAR ═══ */
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0}
.mark{font-size:1.5rem;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:.5rem;font-size:1.05rem;padding:.3rem .9rem;border-radius:2rem;background:var(--bg2);border:.12rem solid var(--line);color:var(--dim)}
.chip.curse{color:var(--curse);border-color:var(--curse)}
.pips{display:flex;gap:.35rem}
.pips i{width:.8rem;height:.8rem;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--c,var(--gold))}
.pips i.now{background:var(--c,var(--gold));box-shadow:0 0 .7rem var(--c,var(--gold))}

/* ═══ TITLE ═══ */
.fan{position:relative;width:100%;height:21rem;margin-top:-1rem}
.fan .mini{position:absolute;left:50%;top:0;width:12.5rem;margin-left:-6.25rem;transform-origin:50% 120%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.fan .mini:nth-child(1){transform:rotate(-13deg) translateX(-5rem)}
.fan .mini:nth-child(2){transform:translateY(-1.2rem);z-index:2}
.fan .mini:nth-child(3){transform:rotate(13deg) translateX(5rem)}
.wordmark{font-size:7.2rem;line-height:.84;letter-spacing:.01em}
.wordmark span{display:block}
.wordmark .b{color:var(--gold);margin-left:2.2rem}
.tag{font-size:1.45rem;max-width:28rem;line-height:1.4;color:var(--dim);font-weight:500}
.stats-line{display:flex;gap:1.8rem;font-size:1.15rem;color:var(--dim)}
.stats-line b{display:block;font-family:var(--disp);font-weight:900;font-size:2.2rem;color:var(--chalk);line-height:1}

/* ═══ MODE / UNIVERSE LISTS ═══ */
.head{font-size:3.2rem;text-align:center;flex-shrink:0}
.modes{display:flex;flex-direction:column;gap:.8rem;width:100%}
.mode{display:flex;align-items:center;gap:1.1rem;width:100%;text-align:left;background:var(--bg2);border:.16rem solid var(--line);border-left:.55rem solid var(--m,var(--gold));border-radius:1rem;padding:1rem 1.2rem;transition:transform .08s,background .1s}
.mode:active{background:var(--card);transform:scale(.985)}
.mode .t{font-size:2.1rem}
.mode .s{font-size:1.1rem;color:var(--dim);margin-top:.2rem;font-weight:500}
.mode .pips{margin-left:auto}
.mode.curse{--m:var(--curse)}
.uni-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;padding-bottom:.5rem}
.uni{background:var(--bg2);border:.16rem solid var(--line);border-radius:.9rem;padding:.8rem .9rem;text-align:left;display:flex;flex-direction:column;gap:.2rem;transition:.1s}
.uni:active{border-color:var(--gold);background:var(--card)}
.uni .n{font-size:1.55rem;line-height:1.05}
.uni .k{font-size:1rem;color:var(--dim);font-weight:500}

/* ═══ PRE-GAME OPTIONS ═══ */
.setup-wrap{width:100%;max-width:38rem;display:flex;flex-direction:column;gap:1.1rem;margin:auto;min-height:0}
.setup-card{background:var(--bg2);border:.16rem solid var(--line);border-radius:1rem;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.7rem}
.setup-title{font-size:1.8rem}
.setup-desc{font-size:1.12rem;color:var(--dim);line-height:1.35;font-weight:500}
.setup-toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.4rem;cursor:pointer}
.switch{width:4.8rem;height:2.7rem;border-radius:2rem;background:#343d68;border:.15rem solid #596493;position:relative;flex-shrink:0;transition:background .18s}
.switch::after{content:"";position:absolute;top:.22rem;left:.22rem;width:2rem;height:2rem;border-radius:50%;background:#e9edf8;transition:transform .18s}
.switch.on{background:#268b69;border-color:#46d68a}
.switch.on::after{transform:translateX(2.05rem);background:#fff}
.luck-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.luck-value{font:900 2.1rem var(--disp);color:var(--gold);min-width:4rem;text-align:right}
.luck-slider{width:100%;height:2.8rem;margin:.3rem 0;appearance:none;-webkit-appearance:none;background:transparent;touch-action:pan-y;cursor:pointer}
.luck-slider::-webkit-slider-runnable-track{height:.8rem;border-radius:1rem;background:linear-gradient(90deg,#3cc8ff,#ffc83d,#ff5470);border:.08rem solid rgba(255,255,255,.18)}
.luck-slider::-moz-range-track{height:.8rem;border-radius:1rem;background:linear-gradient(90deg,#3cc8ff,#ffc83d,#ff5470);border:.08rem solid rgba(255,255,255,.18)}
.luck-slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:2.25rem;height:2.25rem;margin-top:-.78rem;border-radius:50%;background:#fff;border:.28rem solid var(--gold);box-shadow:0 .15rem .6rem #0009}
.luck-slider::-moz-range-thumb{width:1.8rem;height:1.8rem;border-radius:50%;background:#fff;border:.28rem solid var(--gold);box-shadow:0 .15rem .6rem #0009}
.setup-actions{display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap}
/* ═══ AVATAR / CARD ═══ */
.av{--h:200;position:relative;width:var(--s,5rem);height:var(--s,5rem);border-radius:.9rem;overflow:hidden;flex-shrink:0;background:linear-gradient(150deg,hsl(var(--h) 55% 46%),hsl(calc(var(--h) + 40) 60% 24%));display:grid;place-items:center}
.av .mono{font-family:var(--disp);font-weight:900;font-size:calc(var(--s,5rem)*.42);color:rgba(255,255,255,.9);letter-spacing:.02em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;transition:opacity .25s}
.av.ok img{opacity:1}.av.ok .mono{opacity:0}
.card{--rc:var(--common);position:relative;width:100%;background:var(--card);border:.24rem solid var(--rc);border-radius:1.2rem;padding:.8rem;display:flex;flex-direction:column;gap:.7rem;overflow:hidden}
.card .av{width:100%;height:auto;aspect-ratio:1/1;--s:11rem}
.card .nm{font-size:2.6rem}
.card .src{font-size:1.15rem;color:var(--dim);font-weight:500;margin-top:.2rem}
.card .foil{display:flex;justify-content:space-between;align-items:center;background:var(--rc);color:#10131f;border-radius:.6rem;padding:.35rem .8rem;font-size:1.35rem}
.card.h{flex-direction:row;align-items:center;gap:1rem;padding:.7rem}
.card.h .av{width:6.5rem;height:6.5rem;--s:6.5rem;aspect-ratio:auto}
.card.h .info{flex:1;text-align:left;display:flex;flex-direction:column;gap:.35rem}
.card.h .nm{font-size:2.3rem}
.card.h .foil{align-self:flex-start;gap:.5rem}
.mini{width:12.5rem}
.mini .av{--s:10.5rem;width:100%;height:auto;aspect-ratio:1/1}
.mini .nm{font-size:1.5rem}
.mini .foil{font-size:1rem;padding:.2rem .6rem}
.mini .card{padding:.55rem;gap:.5rem}
.r-common{--rc:var(--common)}.r-uncommon{--rc:var(--uncommon)}.r-rare{--rc:var(--rare)}.r-epic{--rc:var(--epic)}.r-legendary{--rc:var(--legendary)}.r-mythic{--rc:var(--mythic)}
.card.r-rare{box-shadow:0 0 1.6rem -.2rem var(--rc)}
.card.r-epic{box-shadow:0 0 2.2rem -.1rem var(--rc)}
.card.r-legendary{box-shadow:0 0 2.8rem 0 var(--rc)}
.card.r-mythic{box-shadow:0 0 3.4rem .1rem var(--rc)}
.card.r-legendary::after,.card.r-mythic::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 2.6s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,30%{transform:translateX(-120%)}70%,100%{transform:translateX(120%)}}
.flip{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
.card.special-reveal{transform-origin:center;animation:specialCardReveal .9s cubic-bezier(.16,1,.3,1) both}
@keyframes specialCardReveal{
  0%{opacity:0;transform:perspective(900px) rotateY(90deg) scale(.72) translateY(2rem);filter:brightness(2.5) blur(5px)}
  55%{opacity:1;transform:perspective(900px) rotateY(-10deg) scale(1.06);filter:brightness(1.5) blur(0)}
  78%{transform:perspective(900px) rotateY(4deg) scale(.98);filter:brightness(1.15)}
  100%{opacity:1;transform:perspective(900px) rotateY(0) scale(1);filter:brightness(1)}
}

@keyframes flip{0%{transform:rotateY(90deg) scale(.9);opacity:0}100%{transform:none;opacity:1}}
.spin .nm{opacity:.55}
.rflash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .15s}
.rflash.go{opacity:1}

/* ═══ PRE-REVEAL IMAGE ═══ */
.prev-ov{position:fixed;inset:0;z-index:280;display:flex;align-items:center;justify-content:center;background:#000;animation:spFadeIn .2s ease}
.prev-ov img{max-width:100%;max-height:100%;object-fit:contain;animation:prevZoom .4s cubic-bezier(.2,.8,.2,1)}
@keyframes prevZoom{from{transform:scale(1.08);opacity:0}to{transform:scale(1);opacity:1}}
.prev-ov .prev-label{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);font-family:var(--disp);font-weight:900;font-size:min(5vw,3.5vh);letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 0 2rem rgba(0,0,0,.8),0 .2rem .6rem rgba(0,0,0,.9);white-space:nowrap}

/* ═══ BOARD ═══ */
.board{display:grid;gap:.6rem;flex-shrink:0}
.board.n2,.board.n4{grid-template-columns:1fr 1fr}
.team{background:var(--bg2);border:.16rem solid var(--line);border-radius:.9rem;padding:.55rem .75rem .45rem;transition:border-color .2s,box-shadow .2s}
.team.active{border-color:var(--c);box-shadow:0 0 1.3rem -.3rem var(--c)}
.team h3{font-size:1.45rem;color:var(--c);margin-bottom:.25rem;display:flex;align-items:center;gap:.5rem}
.slot{display:flex;align-items:baseline;gap:.5rem;padding:.2rem 0;border-top:.1rem solid var(--line);font-size:.95rem}
.slot em{font-style:normal;font-family:var(--disp);font-weight:800;color:var(--dim);width:2.6rem;flex-shrink:0;font-size:1rem}
.slot b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.slot b.empty{color:var(--line)}
.curse-bar{background:rgba(179,107,255,.12);border:.14rem solid var(--curse);color:var(--curse);border-radius:.8rem;padding:.5rem .9rem;text-align:center;font-size:1.15rem;flex-shrink:0}

/* ═══ TURN / ASSIGN ═══ */
.who{font-size:3.4rem;color:var(--c)}
.round{font-size:1.25rem;color:var(--dim);font-weight:500}
.hint{font-size:1.35rem;text-align:center;flex-shrink:0;line-height:1.3}
.hint small{display:block;font-size:1rem;color:var(--dim);margin-top:.2rem;font-weight:500}
.picks{display:flex;flex-direction:column;gap:.55rem;flex:1;min-height:0}
.pick{flex:1;display:flex;align-items:center;gap:1rem;background:var(--bg2);border:.16rem solid var(--line);border-radius:1rem;padding:.4rem 1.1rem;text-align:left;transition:transform .08s,background .1s,border-color .1s}
.pick .ab{font-family:var(--disp);font-weight:900;font-size:1.3rem;width:4rem;padding:.3rem 0;text-align:center;border-radius:.5rem;background:var(--line);color:var(--chalk)}
.pick .lb{font-size:1.9rem}
.pick:active:not(:disabled){background:var(--c);color:#14101a;border-color:var(--c);transform:scale(.98)}
.pick:active:not(:disabled) .ab{background:rgba(0,0,0,.25);color:inherit}
.pick:disabled{opacity:.28}
.pick.curse{border-color:var(--curse)}
.pick.curse:active:not(:disabled){background:var(--curse);border-color:var(--curse)}
.cn{border-bottom:.1rem dashed rgba(255,255,255,.35)}

/* ═══ BATTLE ═══ */
.scorebar{display:flex;justify-content:space-around;gap:.6rem;flex-shrink:0}
.sc{display:flex;align-items:baseline;gap:.5rem;font-size:2.7rem;color:var(--c)}
.sc small{font-size:1.1rem;color:var(--dim);font-family:var(--body);font-weight:600;text-transform:none;letter-spacing:0}
.sc.pop{animation:pop .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes pop{40%{transform:scale(1.35)}}
.blk{background:var(--bg2);border:.16rem solid var(--line);border-radius:1rem;padding:.6rem .8rem .7rem;display:flex;flex-direction:column;gap:.4rem;opacity:0;transform:translateY(1.2rem);transition:opacity .4s,transform .4s;flex-shrink:0;position:relative}
.blk.show{opacity:1;transform:none}
.blk h4{font-size:1.35rem;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.blk h4 .clash{color:var(--gold);opacity:0;font-size:1.1rem}
.blk.fired h4 .clash{animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.2)}100%{opacity:0}}
.ln{display:grid;grid-template-columns:2.6rem 1fr 3.8rem;align-items:center;gap:.7rem;padding:.25rem .3rem;border-radius:.7rem;transition:opacity .4s,background .4s}
.ln .av{--s:2.6rem;border-radius:.5rem}
.ln .mid{min-width:0;display:flex;flex-direction:column;gap:.2rem}
.ln .who2{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-size:1rem;white-space:nowrap}
.ln .who2 span{overflow:hidden;text-overflow:ellipsis}
.ln .who2 i{font-style:normal;font-size:.78rem;color:var(--rc);font-weight:700}
.ln .bar{height:.65rem;background:var(--line);border-radius:1rem;overflow:hidden}
.ln .bar s{display:block;height:100%;width:0;background:var(--c);border-radius:1rem;transition:width 1s cubic-bezier(.2,.8,.2,1) .15s}
.ln .v{font-family:var(--disp);font-weight:900;font-size:2.1rem;text-align:right;line-height:1}
.ln.win{background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset .3rem 0 0 var(--c)}
.ln.lose{opacity:.5}
.ln.tie{background:rgba(255,200,61,.12)}
.final{text-align:center;display:flex;flex-direction:column;gap:.9rem;align-items:center;padding:1rem 0 1.5rem;flex-shrink:0}
.final .w{font-size:4.4rem;color:var(--gold);animation:pop2 .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes pop2{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}}
.final .sub{font-size:1.25rem;color:var(--dim)}

/* ═══ SOLO ═══ */
.solo-top{background:var(--bg2);border:.16rem solid var(--gold);border-radius:1.2rem;padding:1rem;text-align:center;flex-shrink:0}
.solo-top .big{font-size:6rem;color:var(--gold)}
.solo-top .gr{font-size:2rem;margin-top:.3rem}
.srow{display:grid;grid-template-columns:4rem 1fr 3.5rem;align-items:center;gap:.8rem;padding:.55rem .2rem;border-top:.1rem solid var(--line);font-size:1.2rem}
.srow .nm2{display:flex;flex-direction:column}
.srow .nm2 small{color:var(--dim);font-weight:500;font-size:.95rem}
.srow .ab{font-family:var(--disp);font-weight:900;font-size:1.3rem;color:var(--dim)}
.srow .v{font-family:var(--disp);font-weight:900;font-size:2.2rem;text-align:right}

/* ═══ LOOKUP SHEET ═══ */
.ov{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,7,16,.65);backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg2);border:.16rem solid var(--line);border-bottom:0;border-radius:1.5rem 1.5rem 0 0;padding:1.3rem 1.3rem calc(1.6rem + env(safe-area-inset-bottom));width:100%;max-width:46rem;display:flex;flex-direction:column;gap:1rem;animation:up .25s cubic-bezier(.22,.61,.36,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .hd{display:flex;gap:1rem;align-items:center}
.sheet .hd .av{--s:6.5rem}
.sheet .nm{font-size:2.5rem}
.lk{display:flex;align-items:center;gap:1rem;background:var(--bg);border:.16rem solid var(--line);border-radius:1rem;padding:.9rem 1.2rem;font-size:1.5rem;text-align:left;width:100%}
.lk:active{border-color:var(--gold)}
.lk small{display:block;font-size:.95rem;color:var(--dim);font-weight:500}
.err{color:var(--gold);font-size:1.3rem;max-width:32rem;line-height:1.5}
.foilchip{display:inline-block;background:var(--rc);color:#10131f;border-radius:.5rem;padding:.2rem .7rem;font-size:1.1rem;font-family:var(--disp);font-weight:900;text-transform:uppercase}

/* ═══ SPECIAL REVEALS ═══ */
.sp-ov{position:fixed;inset:0;z-index:1000;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
@keyframes spFadeIn{from{opacity:0}to{opacity:1}}
/* shared */
@keyframes beamSpin{to{transform:rotate(360deg)}}

/* Shared cinematic vignette and staged character reveal */
.sp-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.08) 0%,rgba(0,0,0,.48) 48%,rgba(0,0,0,.96) 100%);opacity:0;animation:vignetteIn 1.1s ease forwards}
@keyframes vignetteIn{to{opacity:1}}
.sp-reze-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;opacity:0}
.sp-reze-stage.show{animation:rezeReveal 1.25s cubic-bezier(.16,1,.3,1) forwards}
.sp-reze-stage .sp-reze-image{width:min(68vw,58vh);height:min(68vw,58vh);object-fit:contain;filter:drop-shadow(0 0 2.2rem rgba(255,70,95,.7));transform:scale(.72)}
.sp-reze-stage .sp-reze-name{font-family:var(--disp);font-size:min(8vw,5vh);font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#fff;text-shadow:0 0 1.8rem rgba(255,70,95,.9),0 .2rem .8rem #000}

<body>
<canvas id="particles"></canvas>
<div id="app"></div>
<script>
/* ═══ CONFIG ═══ */
const CATS=[["strength","Strength","STR"],["iq","IQ","IQ"],["durability","Durability","DUR"],["speed","Speed","SPD"],["ability","Ability","ABL"]];
const RARITIES=[
  {key:"common",   label:"Common",   q:0,    color:"#8f9acb"},
  {key:"uncommon", label:"Uncommon", q:.50,  color:"#46d68a"},
  {key:"rare",     label:"Rare",     q:.72,  color:"#4aa8ff", flash:"rgba(74,168,255,.25)"},
  {key:"epic",     label:"Epic",     q:.88,  color:"#b980ff", flash:"rgba(185,128,255,.33)"},
  {key:"legendary",label:"Legendary",q:.95,  color:"#ffc83d", flash:"rgba(255,200,61,.38)"},
  {key:"mythic",   label:"Mythic",   q:.985, color:"#ff5470", flash:"rgba(255,84,112,.45)"}
];
const WEIGHT_EXP=.6, REPEAT_DAMP=.5;
const PCOLORS=["#ff6a3d","#3cc8ff","#b4f23c","#ff7ad9"];
const ROW_MS=2300, IDLE_MS=120000;
const app=document.getElementById("app");
let CHARS=[],UNIS={},S,idle;
const $=h=>{app.innerHTML=h};
const pn=p=>"P"+(p+1), pnLong=p=>"Player "+(p+1);
const rnd=n=>Math.random()*n|0;
const hue=n=>[...n].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const initials=ch=>ch.name.replace(/\(.*?\)/g,"").split(/[\s.]+/).filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const avg=ch=>CATS.reduce((s,c)=>s+ch[c[0]],0)/5;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("touchstart",()=>{clearTimeout(idle);idle=setTimeout(title,IDLE_MS)},{passive:true});

/* ═══ RARITY ═══ */
function calibrate(){
  const a=CHARS.map(avg).sort((x,y)=>x-y);
  RARITIES.forEach(r=>r.min=r.q?a[Math.floor(a.length*r.q)]:-1);
}
function getRarity(ch){for(let i=RARITIES.length-1;i>0;i--)if(avg(ch)>=RARITIES[i].min)return RARITIES[i];return RARITIES[0]}
const foilChip=ch=>`<span class="foilchip r-${getRarity(ch).key}">${getRarity(ch).label}</span>`;

/* ═══ WEIGHTED DRAW ═══ */
function weightOf(ch){
  let w=Math.pow(UNIS[ch.universe],-WEIGHT_EXP);
  if(!S.universe)w*=Math.pow(REPEAT_DAMP,S.seen[ch.universe]||0);
  // Luck increases the relative weight of higher-rarity / higher-stat characters.
  const luck=Math.max(0,Math.min(100,S.luck||0))/100;
  if(luck>0){
    const rarityScore=getRarity(ch).q||0;
    w*=Math.pow(1+rarityScore*7,luck);
  }
  return w;
}
function drawOne(){
  // A developer-selected character takes priority over weighted randomness.
  if(S.nextRoll){
    const forcedIndex=S.pool.indexOf(S.nextRoll);
    if(forcedIndex>=0){
      const ch=S.pool.splice(forcedIndex,1)[0];
      S.nextRoll=null;
      S.seen[ch.universe]=(S.seen[ch.universe]||0)+1;
      return ch;
    }
    // If the selected character is no longer in this game's pool, discard the stale choice.
    S.nextRoll=null;
  }
  const ws=S.pool.map(weightOf);
  let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
  for(;i<ws.length-1;i++){r-=ws[i];if(r<=0)break}
  const ch=S.pool.splice(i,1)[0];
  S.seen[ch.universe]=(S.seen[ch.universe]||0)+1;
  return ch;
}

/* ═══ AVATAR ═══ */
function avatar(ch,size){
  const iconOnly=!!(S&&S.iconsOnly);
  const img=(!iconOnly&&ch.image)?`<img src="${esc(ch.image)}" alt="" referrerpolicy="no-referrer" onload="this.parentNode.classList.add('ok')">`:"";
  return `<div class="av" style="--h:${hue(ch.name)};${size?`--s:${size}`:""}"><span class="mono">${esc(initials(ch))}</span>${img}</div>`;
}

/* ═══ LOOKUP ═══ */
const _lk=[];
function cnLink(ch){
  let i=_lk.indexOf(ch);if(i<0){i=_lk.push(ch)-1}
  return `<span class="cn" data-lookup="${i}">${esc(ch.name)}</span>`;
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-lookup]");
  if(el){e.stopPropagation();showLookup(_lk[+el.dataset.lookup])}
});
function openUrl(u){const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
function showLookup(ch){
  if(!ch)return;closeLookup(true);
  const q=t=>"https://www.google.com/search?q="+encodeURIComponent(t);
  const links=[
    ["Search Google",`${ch.name}, ${ch.source}`,q(ch.name+" "+ch.source)],
    ["Find the wiki page",`${ch.name} wiki`,q(ch.name+" wiki")],
    ["Powers and abilities",`${ch.name} powers`,q(ch.name+" "+ch.source+" powers abilities")]];
  const o=document.createElement("div");o.className="ov";o.id="ov";
  o.innerHTML=`<div class="sheet">
    <div class="hd">${avatar(ch)}<div style="flex:1"><div class="nm d">${esc(ch.name)}</div>
    <div class="muted" style="font-size:1.2rem;margin:.2rem 0 .5rem">${esc(ch.source)}</div>${foilChip(ch)}</div></div>
    ${links.map((l,i)=>`<button class="lk" data-i="${i}"><span style="flex:1">${l[0]}<small>${esc(l[1])}</small></span><span class="muted">↗</span></button>`).join("")}
    <button class="btn ghost" id="lkx">Close</button></div>`;
  document.body.appendChild(o);
  o.onclick=e=>{
    if(e.target===o||e.target.id==="lkx")return closeLookup();
    const b=e.target.closest(".lk");if(b){openUrl(links[+b.dataset.i][2]);closeLookup()}
  };
}
function closeLookup(now){
  const o=document.getElementById("ov");if(!o)return;
  if(now){o.remove();return}
  o.style.transition="opacity .18s";o.style.opacity="0";setTimeout(()=>o.remove(),200);
}

/* ═══ PARTICLES ═══ */
const cvs=document.getElementById("particles"),cx=cvs.getContext("2d");let parts=[];
const fit=()=>{cvs.width=innerWidth;cvs.height=innerHeight};fit();addEventListener("resize",fit);
function burst(x,y,color,n=18){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=1+Math.random()*5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:3+Math.random()*4,color,life:1,dec:.018+Math.random()*.025})}
}
const burstMid=(c,n=35)=>burst(innerWidth/2,innerHeight/2,c,n);
(function loop(){requestAnimationFrame(loop);cx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.98;p.life-=p.dec;if(p.life<=0)return false;
    cx.globalAlpha=p.life;cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();return true});
  cx.globalAlpha=1})();

function rarityFlash(ch,cb){
  const r=getRarity(ch),i=RARITIES.indexOf(r);
  if(i<2)return cb&&cb();
  burstMid(r.color,15+i*12);
  const f=document.createElement("div");f.className="rflash";f.style.background=r.flash;document.body.appendChild(f);
  requestAnimationFrame(()=>{f.classList.add("go");setTimeout(()=>{f.classList.remove("go");setTimeout(()=>{f.remove();cb&&cb()},200)},300+i*80)});
}

/* ═══════════════════════════════════════════════════════════
   PRE-REVEAL IMAGE
   If a character has a `revealImage` field in data.json,
   that image is shown fullscreen for `revealDuration` ms
   (default 1600) BEFORE the card flips and rarity flash.

   Add to any character in data.json:
     "revealImage": "images/sukuna_reveal.jpg",
     "revealDuration": 1800
═══════════════════════════════════════════════════════════ */
function preReveal(ch, cb){
  if(!ch.revealImage){ cb&&cb(); return; }
  const dur = ch.revealDuration || 1600;
  const el=document.createElement("div");
  el.className="prev-ov";
  el.innerHTML=`<img src="${esc(ch.revealImage)}" alt="${esc(ch.name)}"><div class="prev-label d">${esc(ch.name)}</div>`;
  document.body.appendChild(el);
  setTimeout(()=>{
    el.style.transition="opacity .3s";
    el.style.opacity="0";
    setTimeout(()=>{ el.remove(); cb&&cb(); }, 320);
  }, dur);
}

/* ═══════════════════════════════════════════════════════════
   SPECIAL CHARACTER REVEALS
   ─────────────────────────────────────────────────────────
   HOW TO ADD YOUR OWN:
   1. Add an entry to CHAR_SPECIALS below.
      Key = character name, lowercase, trimmed.
   2. Fields:
      • build(el)   — fills the .sp-ov overlay div with HTML.
      • duration    — ms the overlay stays (default 2600).
      • audio       — path to audio file, e.g. "audio/hakari.mp3"
      • audioDelay  — ms before audio starts (default 0).
      • audioStop   — ms after which audio fades (default = duration-600).

   BUILT-IN CSS CLASSES YOU CAN USE IN build():
     Hakari/jackpot:  .sp-jk-bg  .sp-jk-shine  .sp-jk-reels  .sp-jk-txt
     All For One:     .sp-afo-bg .sp-afo-tendrils .sp-afo-ring .sp-afo-ring2 .sp-afo-txt

   QUICK EXAMPLE — add "My Character":
   "my character": {
     duration: 2200,
     audio: "audio/mychar.mp3",
     build(el){
       el.innerHTML = `<div class="sp-afo-bg"></div>
                       <div class="sp-afo-ring"></div>
                       <div class="sp-afo-txt">My Character</div>`;
     }
   }
═══════════════════════════════════════════════════════════ */
const CHAR_SPECIALS = {

  /* ── Hakari Kinji ── */
  "hakari kinji": {
    duration: 3200,
    audio: "audio/jackpot.mp3",
    audioDelay: 300,
    build(el){
      const SYM=["7️⃣","💎","🃏","⭐","🎰"];
      el.innerHTML=`
        <div class="sp-jk-bg"></div>
        <div class="sp-jk-shine"></div>
        <div class="sp-jk-reels">
          <div class="sp-jk-reel" id="jr0">7️⃣</div>
          <div class="sp-jk-reel" id="jr1">💎</div>
          <div class="sp-jk-reel" id="jr2">7️⃣</div>
        </div>
        <div class="sp-jk-txt">JACKPOT!</div>`;
      let idx=0;
      const spin=()=>{
        if(idx>2)return;
        const reel=el.querySelector("#jr"+idx);
        let n=0,si=setInterval(()=>{
          reel.textContent=SYM[rnd(SYM.length)];
          if(++n>10){clearInterval(si);reel.textContent="7️⃣";reel.classList.add("lock");idx++;spin()}
        },80);
      };
      setTimeout(spin,200);
    }
  },

  /* ── All For One ── */
  "all for one": {
    duration: 3000,
    audio: "audio/allforone.mp3",
    audioDelay: 0,
    build(el){
      el.innerHTML=`
        <div class="sp-afo-bg"></div>
        <div class="sp-afo-tendrils"></div>
        <div class="sp-afo-ring2"></div>
        <div class="sp-afo-ring"></div>
        <div class="sp-afo-txt">All For One</div>`;
    }
  },

  /* ── Reze — audio only ── */
  "reze": {
    audio: "audio/reze.mp3",
    audioDelay: 0
  }

  /* ── Add more specials below ── */
};

/* ── audio preload cache ── */
const _audioCache={};
function preloadAudio(){
  const paths=Object.values(CHAR_SPECIALS)
    .map(s=>s.audio).filter(Boolean);
  paths.forEach(p=>{
    if(_audioCache[p])return;
    const a=new Audio();
    a.preload="auto";
    a.src=p;
    _audioCache[p]=a;
  });
}

let _spAudio=null;
let _spFadeTimer=null;

function _stopAudio(fadeMs=0){
  if(_spFadeTimer){clearInterval(_spFadeTimer);_spFadeTimer=null;}
  if(!_spAudio)return;
  const a=_spAudio;
  _spAudio=null;
  if(fadeMs<=0){a.pause();a.currentTime=0;return;}
  const initial=a.volume,started=Date.now();
  _spFadeTimer=setInterval(()=>{
    const t=Math.min(1,(Date.now()-started)/fadeMs);
    a.volume=Math.max(0,initial*(1-t));
    if(t>=1){clearInterval(_spFadeTimer);_spFadeTimer=null;a.pause();a.currentTime=0;}
  },35);
}

function _playSpecialAudio(src,fadeMs,onDone){
  _stopAudio();
  if(!src){onDone(false);return;}
  const audio=new Audio(src);
  _spAudio=audio;
  audio.preload="auto";
  audio.volume=.78;
  let finished=false,fadeStarted=false;
  const finish=ok=>{
    if(finished)return;
    finished=true;
    if(_spAudio===audio)_spAudio=null;
    if(_spFadeTimer){clearInterval(_spFadeTimer);_spFadeTimer=null;}
    onDone(ok);
  };
  audio.addEventListener("timeupdate",()=>{
    if(!fadeStarted && Number.isFinite(audio.duration) && audio.duration>0){
      const remaining=audio.duration-audio.currentTime;
      const fadeSeconds=(fadeMs||1800)/1000;
      if(remaining<=fadeSeconds){
        fadeStarted=true;
        const start=audio.volume,at=audio.currentTime;
        const fade=()=>{
          if(finished)return;
          const progress=Math.min(1,(audio.currentTime-at)/Math.max(.1,remaining));
          audio.volume=Math.max(0,start*(1-progress));
          if(progress<1)requestAnimationFrame(fade);
        };
        requestAnimationFrame(fade);
      }
    }
  });
  audio.addEventListener("ended",()=>finish(true),{once:true});
  audio.addEventListener("error",()=>finish(false),{once:true});
  audio.play().catch(()=>finish(false));
}

function triggerSpecial(ch,cb){
  const key=ch.name.toLowerCase().trim();
  const spec=CHAR_SPECIALS[key];
  if(!spec){cb&&cb();return;}

  const overlay=document.createElement("div");
  overlay.className="sp-ov";
  overlay.innerHTML='<div class="sp-vignette"></div>';

  if(key==="reze"){
    const stage=document.createElement("div");
    stage.className="sp-reze-stage";
    const image=ch.image
      ? `<img class="sp-reze-image" src="${esc(ch.image)}" alt="">`
      : `<div style="transform:scale(1.6);margin-bottom:1rem">${avatar(ch)}</div>`;
    stage.innerHTML=`${image}<div class="sp-reze-name">${esc(ch.name)}</div>`;
    overlay.appendChild(stage);
    document.body.appendChild(overlay);

    // Let the vignette build for five full seconds before Reze appears.
    const revealTimer=setTimeout(()=>stage.classList.add("show"),5000);
    let audioDone=false,visualDone=false,closed=false;
    const close=()=>{
      if(closed||!audioDone||!visualDone)return;
      closed=true;clearTimeout(revealTimer);
      overlay.classList.add("leaving");
      setTimeout(()=>{overlay.remove();cb&&cb();},720);
    };
    setTimeout(()=>{visualDone=true;close();},6300);
    _playSpecialAudio(spec.audio,2000,ok=>{
      audioDone=true;
      // If audio cannot load, don't strand the roll on a blank screen.
      if(!ok)visualDone=true;
      close();
    });
    return;
  }

  if(typeof spec.build==="function")spec.build(overlay);
  document.body.appendChild(overlay);

  let audioDone=!spec.audio,visualDone=false,closed=false;
  const close=()=>{
    if(closed||!audioDone||!visualDone)return;
    closed=true;
    overlay.classList.add("leaving");
    setTimeout(()=>{overlay.remove();cb&&cb();},720);
  };
  // The visual sequence gets its minimum time, but longer tracks are never cut short.
  setTimeout(()=>{visualDone=true;close();},spec.duration||3200);
  if(spec.audio){
    _playSpecialAudio(spec.audio,spec.audioFade||1800,ok=>{
      audioDone=true;
      if(!ok)visualDone=true;
      close();
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   DEV PANEL  —  Shift + 1 + 2 + 3  (desktop only)
   Opens a floating overlay with three tools:
     1. Test a special animation by character name
     2. Force-draw a character by name in the current game
     3. Add a temporary character + download the updated data.json
═══════════════════════════════════════════════════════════ */
const _devKeys=new Set();
document.addEventListener("keydown",e=>{
  _devKeys.add(e.key);
  if(_devKeys.has("Shift")&&_devKeys.has("1")&&_devKeys.has("2")&&_devKeys.has("3"))
    openDevPanel();
});
document.addEventListener("keyup",e=>_devKeys.delete(e.key));

function openDevPanel(){
  if(document.getElementById("dev-ov"))return;
  const o=document.createElement("div");
  o.className="dev-ov";o.id="dev-ov";

  // Gather added-chars list
  const renderAddedList=()=>{
    const added=CHARS.filter(c=>c._dev);
    if(!added.length)return `<div style="color:var(--dim);font-size:1.1rem;padding:.4rem 0">No characters added this session.</div>`;
    return added.map((c,i)=>{
      const r=getRarity(c);
      return `<div class="dev-char-row">
        <span class="dcname">${esc(c.name)}</span>
        <span class="dcsrc">${esc(c.source)}</span>
        <span class="dcr" style="color:${r.color}">${r.label}</span>
        <button class="dcdel" data-delidx="${CHARS.indexOf(c)}" title="Remove">✕</button>
      </div>`;
    }).join("");
  };

  const html=()=>`
  <h2 class="d">🛠 Dev Panel <span class="badge">DESKTOP ONLY</span></h2>

  <div class="dev-sec">
    <label>Test Special Animation</label>
    <div class="dev-row">
      <input class="dev-inp" id="dv-sp-name" placeholder="Character name (e.g. Hakari Kinji)" list="dv-sp-list">
      <datalist id="dv-sp-list">${Object.keys(CHAR_SPECIALS).map(k=>`<option value="${k}">`).join("")}</datalist>
      <button class="dev-btn go" id="dv-sp-go">▶ Play</button>
    </div>
    <div class="dev-msg" id="dv-sp-msg"></div>
  </div>

  <div class="dev-sec">
    <label>Force-Draw Character <span style="font-size:.95rem;color:var(--dim);text-transform:none;letter-spacing:0">(active game only)</span></label>
    <div class="dev-row">
      <input class="dev-inp" id="dv-fd-name" placeholder="Exact character name" list="dv-fd-list">
      <datalist id="dv-fd-list">${CHARS.map(c=>`<option value="${esc(c.name)}">`).join("")}</datalist>
      <button class="dev-btn go" id="dv-fd-go">↓ Force Draw</button>
    </div>
    <div class="dev-msg" id="dv-fd-msg"></div>
  </div>

  <div class="dev-sec">
    <label>Add Character to Roster</label>
    <div class="dev-row">
      <input class="dev-inp" id="dv-nm" placeholder="Name" style="flex:2">
      <input class="dev-inp" id="dv-src" placeholder="Universe / Source" style="flex:2">
      <input class="dev-inp" id="dv-img" placeholder="Image URL (optional)" style="flex:3">
    </div>
    <div class="dev-stat-grid">
      ${CATS.map(c=>`<div class="dev-stat-row"><label>${c[1]}</label><input class="dev-inp" id="dv-${c[0]}" type="number" min="1" max="100" placeholder="1–100"></div>`).join("")}
    </div>
    <div class="dev-row">
      <button class="dev-btn go" id="dv-add-go" style="flex:1">+ Add to Roster</button>
      <button class="dev-btn dl" id="dv-dl">⬇ Download data.json</button>
    </div>
    <div class="dev-msg" id="dv-add-msg"></div>
  </div>

  <div class="dev-sec">
    <label>Session Characters <span style="font-size:.95rem;color:var(--dim);text-transform:none;letter-spacing:0">(added this session, marked _dev)</span></label>
    <div class="dev-char-list" id="dv-char-list">${renderAddedList()}</div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem">
    <span class="dev-kbd">Open with <kbd>Shift</kbd>+<kbd>1</kbd>+<kbd>2</kbd>+<kbd>3</kbd></span>
    <button class="dev-close" id="dv-close">Close ✕</button>
  </div>`;

  o.innerHTML=`<div class="dev-box">${html()}</div>`;
  document.body.appendChild(o);

  const msg=(id,text,type)=>{const el=document.getElementById(id);if(el){el.textContent=text;el.className="dev-msg "+(type||"ok")}};
  const refreshList=()=>{const el=document.getElementById("dv-char-list");if(el)el.innerHTML=renderAddedList()};

  // ── Test special ──
  document.getElementById("dv-sp-go").onclick=()=>{
    const name=document.getElementById("dv-sp-name").value.trim();
    const key=name.toLowerCase();
    if(!CHAR_SPECIALS[key])return msg("dv-sp-msg",`No special for "${name}"  — available: ${Object.keys(CHAR_SPECIALS).join(", ")}`,"err");
    // find or fake char
    const ch=CHARS.find(c=>c.name.toLowerCase()===key)||{name,source:"",image:""};
    msg("dv-sp-msg","Playing…","ok");
    triggerSpecial(ch,()=>msg("dv-sp-msg","Done.","ok"));
  };

  // ── Force draw ──
  document.getElementById("dv-fd-go").onclick=()=>{
    const name=document.getElementById("dv-fd-name").value.trim();
    if(!S||!S.pool)return msg("dv-fd-msg","No active game — start a game first","err");
    const idx=S.pool.findIndex(c=>c.name.toLowerCase()===name.toLowerCase());
    if(idx<0)return msg("dv-fd-msg",`"${name}" not in current pool (may already be drawn)`,"err");
    // Store an explicit one-time override; weighted random selection is bypassed next roll.
    S.nextRoll=S.pool[idx];
    msg("dv-fd-msg",`${S.nextRoll.name} is locked in for the next roll`,"ok");
  };

  // ── Add character ──
  document.getElementById("dv-add-go").onclick=()=>{
    const nm=document.getElementById("dv-nm").value.trim();
    const src=document.getElementById("dv-src").value.trim();
    const img=document.getElementById("dv-img").value.trim();
    if(!nm||!src)return msg("dv-add-msg","Name and Source are required","err");
    const stats={};
    for(const c of CATS){
      const v=parseInt(document.getElementById("dv-"+c[0]).value);
      if(isNaN(v)||v<1||v>100)return msg("dv-add-msg",`${c[1]} must be 1–100`,"err");
      stats[c[0]]=v;
    }
    if(CHARS.find(c=>c.name.toLowerCase()===nm.toLowerCase()))
      return msg("dv-add-msg",`"${nm}" already exists in the roster`,"err");
    const newChar={name:nm,source:src,universe:src,...stats,image:img||"",_dev:true};
    CHARS.push(newChar);
    UNIS[src]=(UNIS[src]||0)+1;
    calibrate();
    // clear inputs
    ["dv-nm","dv-src","dv-img",...CATS.map(c=>"dv-"+c[0])].forEach(id=>{
      const el=document.getElementById(id);if(el)el.value="";
    });
    msg("dv-add-msg",`✓ ${nm} added (${getRarity(newChar).label})  —  download data.json to save permanently`,"ok");
    refreshList();
  };

  // ── Download data.json ──
  document.getElementById("dv-dl").onclick=()=>{
    // Strip _dev flag from export
    const exportChars=CHARS.map(c=>{const {_dev,...rest}=c;return rest});
    const json=JSON.stringify({characters:exportChars},null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="data.json";
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    msg("dv-add-msg","data.json downloaded — replace your file with this to save permanently","ok");
  };

  // ── Delete dev char ──
  o.addEventListener("click",e=>{
    const btn=e.target.closest(".dcdel");
    if(!btn)return;
    const idx=+btn.dataset.delidx;
    const ch=CHARS[idx];
    if(!ch||!ch._dev)return;
    UNIS[ch.universe]=(UNIS[ch.universe]||1)-1;
    if(UNIS[ch.universe]<=0)delete UNIS[ch.universe];
    CHARS.splice(idx,1);
    calibrate();
    refreshList();
    // rebuild datalist
    const dl=document.getElementById("dv-fd-list");
    if(dl)dl.innerHTML=CHARS.map(c=>`<option value="${esc(c.name)}">`).join("");
  });

  // ── Close ──
  document.getElementById("dv-close").onclick=closeDevPanel;
  o.addEventListener("mousedown",e=>{if(e.target===o)closeDevPanel()});
}

function closeDevPanel(){
  const o=document.getElementById("dev-ov");
  if(!o)return;
  o.style.transition="opacity .18s";o.style.opacity="0";
  setTimeout(()=>o.remove(),200);
}

/* ═══ INIT ═══ */
async function init(){
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    CHARS=(await r.json()).characters;
    CHARS.forEach(c=>{c.universe=c.universe||c.source;UNIS[c.universe]=(UNIS[c.universe]||0)+1});
    if(CHARS.length<10)throw new Error("data.json needs at least 10 characters");
    calibrate();
    preloadAudio();
    title();
  }catch(e){
    $(`<div class="center"><h1 class="wordmark d"><span>Mashup</span><span class="b">Brawl</span></h1><p class="err">Couldn't load data.json: ${esc(e.message)}.<br>Open the game from a local web server, or launch the browser with file access allowed.</p></div>`);
  }
}

/* ═══ TITLE ═══ */
function title(){
  closeLookup(true);
  const hi=shuffleArr(CHARS.filter(c=>getRarity(c).q>=.72&&c.image));
  const pick=[hi[0],hi[1],hi[2]].filter(Boolean);
  while(pick.length<3)pick.push(CHARS[rnd(CHARS.length)]);
  $(`<div class="center">
    <div class="fan">${pick.map(c=>`<div class="mini"><div class="card r-${getRarity(c).key}">${avatar(c)}<div><div class="nm d">${esc(c.name)}</div></div><div class="foil d">${getRarity(c).label}</div></div></div>`).join("")}</div>
    <h1 class="wordmark d"><span>Mashup</span><span class="b">Brawl</span></h1>
    <p class="tag">Roll fighters from across every universe, slot each one into a stat, and out-build your rival.</p>
    <div class="stats-line"><div><b>${CHARS.length}</b>fighters</div><div><b>${Object.keys(UNIS).length}</b>universes</div><div><b>5</b>stats</div></div>
    <button class="btn d" id="go">Start</button>
  </div>`);
  document.getElementById("go").onclick=modeSelect;
}
function shuffleArr(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}

/* ═══ MODES ═══ */
const MODES=[
  ["classic","Classic brawl","2 players · whole roster · best team wins",2,""],
  ["four","4-player mayhem","4 players · whole roster · most category wins",4,""],
  ["universe","Universe draft","2 players · one universe only",2,""],
  ["cursed","Cursed mode","2 players · whole roster · lowest stats win",2,"curse"],

function modeSelect(){

  <div class="scroll"><div class="modes">${MODES.map(m=>`<button class="mode ${m[4]}" data-mode="${m[0]}">
    <div><div class="t d" style="${m[4]?"color:var(--curse)":""}">${m[1]}</div><div class="s">${m[2]}</div></div>

}
function universePicker(){

  <p class="muted" style="text-align:center;font-size:1.2rem;flex-shrink:0">Every fighter in the draft comes from this universe.</p>

/* ═══ PRE-GAME OPTIONS ═══ */
function gameSetup(mode,universe){
  const opts={iconsOnly:false,luck:0};
  const modeName=mode==="universe"?`Universe draft · ${esc(universe)}`:MODES.find(m=>m[0]===mode)[1];
  $(`<div class="head d">Game settings</div>
    <p class="muted" style="text-align:center;font-size:1.2rem;flex-shrink:0">Customize this match before it begins.</p>
    <div class="scroll"><div class="setup-wrap">
      <div class="setup-card">
        <div class="setup-toggle" id="icons-toggle" role="switch" aria-checked="false" tabindex="0">
          <div><div class="setup-title d">Icons only</div><div class="setup-desc">Hide character artwork and use initials icons on every card.</div></div>
          <div class="switch" id="icons-switch"></div>
        </div>
      </div>
      <div class="setup-card">
        <div class="luck-head"><div><div class="setup-title d">Increase luck</div><div class="setup-desc">Boost the odds of rolling higher-rarity, higher-stat characters.</div></div><div class="luck-value" id="luck-value">0%</div></div>
        <input class="luck-slider" id="luck-slider" type="range" min="0" max="100" step="5" value="0" aria-label="Luck boost">
        <div style="display:flex;justify-content:space-between;color:var(--dim);font-size:1rem"><span>Normal odds</span><span>Maximum luck</span></div>
      </div>
      <div class="setup-card"><div class="setup-title d">${modeName}</div><div class="setup-desc">These settings apply to this game only.</div></div>
    </div></div>
    <div class="setup-actions"><button class="btn ghost d" id="setup-back">Back</button><button class="btn d" id="setup-start">Start game</button></div>`);
  const toggle=document.getElementById("icons-toggle"),sw=document.getElementById("icons-switch");
  const setIcons=value=>{opts.iconsOnly=value;sw.classList.toggle("on",value);toggle.setAttribute("aria-checked",String(value));};
  const flip=()=>setIcons(!opts.iconsOnly);
  toggle.onclick=flip;
  toggle.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};

/* ═══ GAME ═══ */
function newGame(mode,universe,opts={}){
  const n=mode==="four"?4:mode==="solo"?1:2;
  S={mode,universe:universe||null,n,total:n*5,turn:0,seen:{},nextRoll:null,iconsOnly:!!opts.iconsOnly,luck:Math.max(0,Math.min(100,+opts.luck||0)),
     pool:CHARS.filter(c=>!universe||c.universe===universe),teams:Array.from({length:n},()=>({}))};
  turnScreen();
}
const modeChip=()=>S.mode==="cursed"?`<span class="chip curse">Cursed · lowest wins</span>`:`<span class="chip">${S.universe?esc(S.universe):MODES.find(m=>m[0]===S.mode)[1]}</span>`;
const topBar=()=>`<div class="top"><span class="mark d">Mashup Brawl</span>${modeChip()}</div>`;

function board(act){
  return `<div class="board n${S.n===1?1:S.n===4?4:2}">${S.teams.map((t,i)=>`<div class="team c${i+1} ${i===act?"active":""}">
    <h3 class="d">${S.n===1?"Your team":pn(i)}</h3>
    ${CATS.map(c=>`<div class="slot"><em>${c[2]}</em><b class="${t[c[0]]?"":"empty"}">${t[c[0]]?cnLink(t[c[0]]):"—"}</b></div>`).join("")}</div>`).join("")}</div>`;
}
function turnScreen(){
  const p=S.turn%S.n,round=Math.floor(S.turn/S.n);
  $(`<div class="c${p+1}" style="display:contents">
    ${topBar()}${board(p)}
    <div class="center">
      <div class="who d">${S.n===1?"Your turn":pnLong(p)+"'s turn"}</div>
      <div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<round?"on":i===round?"now":""}"></i>`).join("")}</div>
      <div class="round">Round ${round+1} of 5</div>
      <button class="btn pc d" id="roll">Roll a fighter</button>
    </div></div>`);
  document.getElementById("roll").onclick=function(){this.disabled=true;roll(p)};
}

/* ═══ ROLL ═══ */
function roll(p){
  const got=drawOne();
  const src=S.universe?S.pool.concat(got):CHARS;
  $(`<div class="c${p+1}" style="display:contents">${topBar()}
    <div class="center"><div style="width:100%;max-width:26rem"><div class="card spin" id="card">
      <div id="av"></div><div><div class="nm d" id="nm">Rolling…</div><div class="src" id="sr">&nbsp;</div></div>
      <div class="foil d" id="fo" style="visibility:hidden">&nbsp;</div></div></div></div></div>`);
  let n=0;
  const t=setInterval(()=>{
    const f=src[rnd(src.length)];
    av.innerHTML=avatar(f);nm.textContent=f.name;sr.textContent=f.source;
    if(++n<16)return;
    clearInterval(t);
    // 1. Optional character artwork, then the special music/animation.
    // 2. Only after the special sequence finishes do we reveal the actual card.
    preReveal(got,()=>{
      triggerSpecial(got,()=>{
        const r=getRarity(got);
        card.className="card special-reveal r-"+r.key;
        av.innerHTML=avatar(got);
        nm.innerHTML=cnLink(got);
        sr.textContent=got.source;
        fo.textContent=r.label;
        fo.style.visibility="visible";
        rarityFlash(got,()=>setTimeout(()=>assign(p,got),500));
      });
    });
  },70);
}

/* ═══ ASSIGN ═══ */
function assign(p,ch){
  const cur=S.mode==="cursed",r=getRarity(ch);
  $(`<div class="c${p+1}" style="display:contents">${topBar()}
    <div class="card h r-${r.key}">${avatar(ch)}<div class="info"><div class="nm d">${cnLink(ch)}</div><div class="src muted" style="font-size:1.15rem">${esc(ch.source)}</div>${foilChip(ch)}</div></div>
    <div class="hint">${S.n===1?"Where does":pnLong(p)+": where does"} ${esc(ch.name)} fit ${cur?"<b style='color:var(--curse)'>worst</b>":"best"}?<small>Tap the name to look them up</small></div>
    <div class="picks">${CATS.map(c=>`<button class="pick ${cur?"curse":""}" data-k="${c[0]}" ${S.teams[p][c[0]]?"disabled":""}><span class="ab">${c[2]}</span><span class="lb d">${c[1]}</span></button>`).join("")}</div>
  </div>`);
  document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{
    S.teams[p][b.dataset.k]=ch;S.turn++;
    S.turn>=S.total?(S.mode==="solo"?soloResult():battle()):turnScreen();
  });
}

/* ═══ SOLO ═══ */
function soloResult(){
  const t=S.teams[0],tot=CATS.reduce((s,c)=>s+t[c[0]][c[0]],0),a=tot/5;
  const g=a>=90?["S","#ff5470"]:a>=80?["A","#ffc83d"]:a>=70?["B","#b980ff"]:a>=60?["C","#4aa8ff"]:a>=50?["D","#46d68a"]:["F","#8f9acb"];
  let best=0,isBest=false;
  try{best=+localStorage.getItem("mb_solo_best")||0;if(tot>best){localStorage.setItem("mb_solo_best",tot);isBest=best>0;best=tot}}catch(e){}
  burstMid(g[1],25);
  $(`${topBar()}
  <div class="solo-top"><div class="big d">${tot}</div>
    <div class="gr d" style="color:${g[1]}">Grade ${g[0]} · avg ${a.toFixed(1)}</div>
    <div class="muted" style="font-size:1.1rem;margin-top:.4rem">${isBest?"New personal best!":best?"Personal best: "+best:""}</div></div>
  <div class="scroll">${CATS.map(c=>{const ch=t[c[0]],r=getRarity(ch);
    return `<div class="srow"><span class="ab">${c[2]}</span><span class="nm2">${cnLink(ch)}<small>${esc(ch.source)} · ${r.label}</small></span><span class="v" style="color:${r.color}">${ch[c[0]]}</span></div>`}).join("")}</div>
  <div class="row-btns" style="flex-shrink:0"><button class="btn sm d" id="again">Try again</button><button class="btn ghost d" id="menu">Menu</button></div>`);
  document.getElementById("again").onclick=()=>newGame("solo");
  document.getElementById("menu").onclick=title;
}

/* ═══ BATTLE ═══ */
function battle(){
  const cur=S.mode==="cursed",n=S.n,wins=Array(n).fill(0);
  const totals=S.teams.map(t=>CATS.reduce((s,c)=>s+t[c[0]][c[0]],0));
  const win=CATS.map(c=>{const v=S.teams.map(t=>t[c[0]][c[0]]),b=cur?Math.min(...v):Math.max(...v);return v.map(x=>x===b)});
  const blk=i=>{const c=CATS[i],tie=win[i].every(Boolean);
    return `<div class="blk" id="b${i}"><h4 class="d"><span>${c[1]}</span><span class="clash">${cur?"Lowest wins":"Clash!"}</span></h4>
    ${S.teams.map((t,pi)=>{const ch=t[c[0]],w=win[i][pi],r=getRarity(ch);
      return `<div class="ln c${pi+1} ${tie?"tie":w?"win":"lose"} r-${r.key}">${avatar(ch)}
        <div class="mid"><div class="who2"><span>${n>1?`<b style="color:var(--c)">${pn(pi)}</b> `:""}${cnLink(ch)}</span><i>${r.label}</i></div><div class="bar"><s data-w="${ch[c[0]]}"></s></div></div>
        <div class="v">${ch[c[0]]}</div></div>`}).join("")}</div>`};
  $(`${topBar()}
  <div class="scorebar d">${S.teams.map((_,i)=>`<div class="sc c${i+1}" id="sc${i}">${pn(i)} <span>0</span></div>`).join("")}</div>
  <div class="scroll" id="bw">${CATS.map((_,i)=>blk(i)).join("")}<div class="final" id="final"></div></div>`);
  CATS.forEach((c,i)=>{
    setTimeout(()=>{
      const b=document.getElementById("b"+i);if(!b)return;
      b.classList.add("show");b.scrollIntoView({behavior:"smooth",block:"center"});
      b.querySelectorAll(".bar s").forEach(s=>s.style.width=s.dataset.w+"%");
      setTimeout(()=>{b.classList.add("fired");burstMid("#ffc83d",12)},600);
      setTimeout(()=>{
        win[i].forEach((w,pi)=>{if(w)wins[pi]++});
        S.teams.forEach((_,pi)=>{const el=document.getElementById("sc"+pi);if(!el)return;
          el.lastElementChild.textContent=wins[pi];el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")});
        win[i].forEach((w,pi)=>{if(w)burst(innerWidth*(n===1?.5:.25+.5*(pi%2)),innerHeight*.5,PCOLORS[pi],18)});
      },1200);
    },450+i*ROW_MS);
  });
  setTimeout(()=>{
    const mx=Math.max(...wins),top=wins.map((w,i)=>w===mx?i:-1).filter(i=>i>=0);
    let winner=-1;
    if(top.length===1)winner=top[0];
    else{const b=(cur?Math.min:Math.max)(...top.map(i=>totals[i])),tb=top.filter(i=>totals[i]===b);if(tb.length===1)winner=tb[0]}
    if(winner>=0){burstMid(PCOLORS[winner],40);setTimeout(()=>burstMid(PCOLORS[winner],30),400)}
    final.innerHTML=(winner<0?`<div class="w d">It's a draw</div>`:`<div class="w d" style="color:var(--p${winner+1})">${pnLong(winner)} wins</div>`)+
      `<div class="sub">${wins.map((w,i)=>`${pn(i)}: ${w} categories · ${totals[i]} total`).join("<br>")}</div>
      ${cur?`<div style="color:var(--curse);font-size:1.15rem">The lowest stats took it.</div>`:""}
      <div class="row-btns"><button class="btn sm d" id="again">Play again</button><button class="btn ghost d" id="menu">Menu</button></div>`;
    document.getElementById("again").onclick=()=>newGame(S.mode,S.universe);
    document.getElementById("menu").onclick=title;
    final.scrollIntoView({behavior:"smooth",block:"end"});
  },450+CATS.length*ROW_MS+1300);
}

init();
</script>
</body>

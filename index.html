<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mashup Brawl</title>
<style>
:root{--ink:#12102a;--panel:#1f1b45;--line:#3a3470;--p1:#ff5a36;--p2:#2ec4ff;--p3:#7cff6b;--p4:#ff6bde;--gold:#ffd23f;--paper:#f6f1ff;--dim:#9a94c9;--curse:#b44fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{font-size:min(3.1vw,1.75vh)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);touch-action:manipulation;overscroll-behavior:none;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.display{font-family:Impact,"Arial Black","Haettenschweiler",sans-serif;letter-spacing:.04em;text-transform:uppercase}
#app{height:100%;display:flex;flex-direction:column;padding:1.4rem;gap:1rem}
.c1{--c:var(--p1)}.c2{--c:var(--p2)}.c3{--c:var(--p3)}.c4{--c:var(--p4)}

/* ── TITLE ── */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.6rem}
.title{font-size:6rem;line-height:.9;margin:0;transform:rotate(-3deg);text-shadow:.35rem .35rem 0 var(--p1),-.3rem -.3rem 0 var(--p2)}
.sub{font-size:1.6rem;color:var(--dim);max-width:32rem;line-height:1.4}
.big{background:var(--gold);color:var(--ink);font-size:2.4rem;padding:1.2rem 3rem;border-radius:1rem;box-shadow:0 .5rem 0 #b38b00;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.big:active{transform:translateY(.4rem);box-shadow:0 .1rem 0 #b38b00}
.big.ghost{background:transparent;color:var(--dim);box-shadow:none;border:.2rem solid var(--line);font-size:1.6rem;padding:.8rem 2rem}
.big.ghost:active{background:var(--line)}

/* ── MODE SELECT ── */
.modes{display:flex;flex-direction:column;gap:.9rem;width:100%;max-width:38rem}
.mode-btn{display:flex;align-items:center;gap:1.2rem;background:var(--panel);border:.2rem solid var(--line);border-radius:1.2rem;padding:1rem 1.4rem;text-align:left;width:100%;transition:.08s}
.mode-btn:active{border-color:var(--gold);background:#2a255a}
.mode-btn.selected{border-color:var(--gold);background:#2a255a}
.mode-icon{font-size:2.6rem;flex-shrink:0;width:3rem;text-align:center}
.mode-title{font-size:1.8rem;line-height:1;color:var(--paper)}
.mode-title.curse{color:var(--curse)}
.mode-desc{font-size:1.1rem;color:var(--dim);margin-top:.2rem}

/* ── UNIVERSE PICKER ── */
.uni-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%;overflow-y:auto;flex:1}
.uni-btn{background:var(--panel);border:.2rem solid var(--line);border-radius:1rem;padding:.9rem .8rem;font-size:1.4rem;text-align:center;line-height:1.3}
.uni-btn:active,.uni-btn.selected{border-color:var(--gold);background:#2a255a;color:var(--gold)}

/* ── BOARD ── */
.board{display:grid;gap:.7rem}
.board.p2{grid-template-columns:1fr 1fr}
.board.p4{grid-template-columns:1fr 1fr}
.team{background:var(--panel);border:.2rem solid var(--line);border-radius:1rem;padding:.7rem .9rem}
.team.active{border-color:var(--c);box-shadow:0 0 1.5rem -.2rem var(--c)}
.team h3{margin:0 0 .4rem;font-size:1.5rem;color:var(--c)}
.slot{display:flex;justify-content:space-between;gap:.4rem;font-size:.95rem;padding:.2rem 0;border-top:.1rem solid var(--line);color:var(--dim)}
.slot b{color:var(--paper);font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.banner{font-size:2.6rem;text-align:center;color:var(--c);flex-shrink:0}

/* ── AVATAR ── */
.avatar{border-radius:50%;display:grid;place-items:center;font-size:3.2rem;color:#fff;border:.3rem solid var(--paper);text-shadow:0 .15rem 0 rgba(0,0,0,.4);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}

/* ── CARD / ASSIGN ── */
.card{background:var(--panel);border:.25rem solid var(--c);border-radius:1.4rem;padding:1.3rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem;flex-shrink:0}
.cname{font-size:2.6rem;line-height:1}
.csrc{font-size:1.2rem;color:var(--dim)}
.assign-row{display:flex;gap:1.1rem;align-items:center}
.assign-info{text-align:left}
.hint{text-align:center;font-size:1.3rem;color:var(--dim);flex-shrink:0}
.hint.curse-hint{color:var(--curse)}
.picks{display:flex;flex-direction:column;gap:.6rem;flex:1}
.pick{display:flex;align-items:center;gap:1rem;background:var(--panel);border:.2rem solid var(--line);border-radius:1rem;padding:.9rem 1.3rem;font-size:2rem;text-align:left;flex:1;width:100%}
.pick .icon{font-size:2.2rem;line-height:1;flex-shrink:0}
.pick .label{font-size:1.7rem;flex:1}
.pick:active:not(:disabled){background:var(--c);color:var(--ink)}
.pick:disabled{opacity:.35}
.pick.curse-pick{border-color:var(--curse)}
.pick.curse-pick:active:not(:disabled){background:var(--curse)}

/* ── BATTLE ── */
.score{display:flex;justify-content:space-around;font-size:3rem;flex-shrink:0;flex-wrap:wrap;gap:.5rem}
.score span{padding:0 .4rem}
.battle-wrap{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:.7rem;padding-bottom:1rem}
.row{display:grid;gap:.5rem;align-items:stretch;opacity:.2;transition:opacity .4s;min-height:8rem}
.row.p2{grid-template-columns:1fr 6rem 1fr}
.row.p4{grid-template-columns:1fr 1fr 5rem 1fr 1fr}
.side{background:var(--panel);border:.2rem solid var(--line);border-radius:1rem;padding:.4rem .5rem;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.25rem;text-align:center;transition:.3s}
.side-av{width:3.6rem;height:3.6rem;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;color:#fff;overflow:hidden;flex-shrink:0;border:.2rem solid rgba(255,255,255,.25)}
.side-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.side .n{font-size:1rem;line-height:1.1}
.side .num{font-family:Impact,sans-serif;font-size:2.2rem;line-height:1}
.row.show{opacity:1}
.row.show .side.win{border-color:var(--c);background:var(--c);color:var(--ink);transform:scale(1.03)}
.row.show .side.lose{opacity:.5}
.mid{text-align:center;font-size:1rem;color:var(--dim);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.15rem}.mid span{font-size:1.8rem}
.final{text-align:center;display:flex;flex-direction:column;gap:1rem;align-items:center;padding:1rem 0 2rem;flex-shrink:0}
.final .w{font-size:4rem;line-height:1;color:var(--gold)}
.err{color:var(--gold);font-size:1.5rem;max-width:34rem;line-height:1.5}

/* curse banner */
.curse-banner{background:linear-gradient(135deg,#2a0845,#1f1b45);border:.2rem solid var(--curse);border-radius:1rem;padding:.6rem 1rem;text-align:center;font-size:1.3rem;color:var(--curse);flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CATS=[["strength","Strength","💪"],["iq","IQ","🧠"],["durability","Durability","🛡️"],["speed","Speed","⚡"],["ability","Ability","✨"]];
const PCOLORS=["var(--p1)","var(--p2)","var(--p3)","var(--p4)"];
const app=document.getElementById("app");
let CHARS=[],S,idle;
const $=(h)=>{app.innerHTML=h};
const pn=p=>"P"+(p+1);
const pnLong=p=>"Player "+(p+1);
const hue=n=>[...n].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const initials=ch=>ch.name.split(" ").map(w=>w[0]).join("").slice(0,2);
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}return b};
const uniq=arr=>[...new Set(arr)].sort();
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("touchstart",()=>{clearTimeout(idle);idle=setTimeout(title,120000)},{passive:true});

function avatarHTML(ch,size="8.5rem"){
  const bg=`hsl(${hue(ch.name)} 55% 42%)`;
  const ini=initials(ch).replace(/'/g,"");
  if(ch.image) return `<div class="avatar display" style="width:${size};height:${size};background:${bg}"><img src="${ch.image}" alt="${ch.name}" onerror="this.parentNode.innerHTML='${ini}';this.parentNode.classList.add('display')"></div>`;
  return `<div class="avatar display" style="width:${size};height:${size};background:${bg}">${ini}</div>`;
}
function sideAvatarHTML(ch){
  const bg=`hsl(${hue(ch.name)} 55% 42%)`;
  const ini=initials(ch).replace(/'/g,"");
  if(ch.image) return `<div class="side-av" style="background:${bg}"><img src="${ch.image}" alt="${ch.name}" onerror="this.parentNode.innerHTML='${ini}';this.parentNode.classList.add('display')"></div>`;
  return `<div class="side-av display" style="background:${bg}">${ini}</div>`;
}

async function init(){
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    CHARS=(await r.json()).characters;
    if(CHARS.length<10)throw new Error("Need at least 10 characters in data.json");
    title();
  }catch(e){
    $(`<div class="center"><h1 class="title display">Mashup Brawl</h1><p class="err">Could not load data.json — ${e.message}.<br>Serve from a local web server or use --allow-file-access-from-files.</p></div>`);
  }
}

/* ═══════════════════════════════
   TITLE + MODE SELECT
═══════════════════════════════ */
function title(){
  $(`<div class="center">
    <h1 class="title display">Mashup<br>Brawl</h1>
    <button class="big display" id="go">Choose Mode</button>
  </div>`);
  document.getElementById("go").onclick=modeSelect;
}

function modeSelect(){
  $(`<div class="center">
    <div class="banner display" style="color:var(--gold)">Select Mode</div>
    <div class="modes">
      <button class="mode-btn" data-mode="classic">
        <span class="mode-icon">⚔️</span>
        <div><div class="mode-title display">Classic Brawl</div><div class="mode-desc">2 players · all characters · best team wins</div></div>
      </button>
      <button class="mode-btn" data-mode="four">
        <span class="mode-icon">🔥</span>
        <div><div class="mode-title display">4-Player Mayhem</div><div class="mode-desc">4 players · all characters · most categories wins</div></div>
      </button>
      <button class="mode-btn" data-mode="universe">
        <span class="mode-icon">🌌</span>
        <div><div class="mode-title display">Universe Draft</div><div class="mode-desc">2 players · pick a universe · characters from that world only</div></div>
      </button>
      <button class="mode-btn" data-mode="cursed">
        <span class="mode-icon">💀</span>
        <div><div class="mode-title curse display">Cursed Mode</div><div class="mode-desc">2 players · all characters · lowest stats win</div></div>
      </button>
    </div>
    <button class="big ghost display" id="back">← Back</button>
  </div>`);
  document.querySelectorAll(".mode-btn").forEach(b=>b.onclick=()=>startMode(b.dataset.mode));
  document.getElementById("back").onclick=title;
}

function startMode(mode){
  if(mode==="universe") universePicker();
  else newGame(mode);
}

/* ═══════════════════════════════
   UNIVERSE PICKER
═══════════════════════════════ */
function universePicker(){
  const sources=uniq(CHARS.map(c=>c.source));
  // only show sources with enough characters
  const valid=sources.filter(s=>CHARS.filter(c=>c.source===s).length>=2);
  $(`<div class="banner display" style="color:var(--gold)">Pick a Universe</div>
  <div class="sub" style="flex-shrink:0;text-align:center">Characters will be drawn only from this universe.</div>
  <div class="uni-grid">${valid.map(s=>`<button class="uni-btn" data-src="${s}">${s}<br><span style="font-size:1rem;color:var(--dim)">${CHARS.filter(c=>c.source===s).length} chars</span></button>`).join("")}</div>
  <button class="big ghost display" id="back" style="flex-shrink:0">← Back</button>`);
  document.querySelectorAll(".uni-btn").forEach(b=>b.onclick=()=>newGame("universe",b.dataset.src));
  document.getElementById("back").onclick=modeSelect;
}

/* ═══════════════════════════════
   GAME INIT
═══════════════════════════════ */
function newGame(mode,universe){
  const numPlayers=mode==="four"?4:2;
  const totalTurns=numPlayers*CATS.length; // 5 rounds each
  let pool;
  if(mode==="universe"){
    const src=CHARS.filter(c=>c.source===universe);
    // pad with randoms from other sources if too few
    pool=shuffle(src.length>=totalTurns?src:[...src,...shuffle(CHARS.filter(c=>c.source!==universe)).slice(0,totalTurns-src.length)]);
  } else {
    pool=shuffle([...CHARS]);
  }
  S={mode,universe:universe||null,numPlayers,totalTurns,pool,turn:0,
     teams:Array.from({length:numPlayers},()=>({}))};
  turnScreen();
}

/* ═══════════════════════════════
   BOARD HTML
═══════════════════════════════ */
function boardHTML(activep){
  const cls=S.numPlayers===4?"p4":"p2";
  return `<div class="board ${cls}">${S.teams.map((t,i)=>`<div class="team c${i+1} ${i===activep?"active":""}"><h3 class="display">${pn(i)}</h3>${
    CATS.map(c=>`<div class="slot"><span>${c[2]}</span><b>${t[c[0]]?t[c[0]].name:"—"}</b></div>`).join("")}</div>`).join("")}</div>`;
}

/* ═══════════════════════════════
   TURN FLOW
═══════════════════════════════ */
function turnScreen(){
  const p=S.turn%S.numPlayers;
  const round=Math.floor(S.turn/S.numPlayers)+1;
  const cursed=S.mode==="cursed";
  $(`<div class="c${p+1}" style="display:contents">
    ${S.mode==="cursed"?`<div class="curse-banner">💀 CURSED MODE — Build the WORST team! Lowest stats win each category! 💀</div>`:""}
    ${boardHTML(p)}
    <div class="center">
      <div class="banner display">${pnLong(p)}, your turn</div>
      <div class="sub">Round ${round} of 5${S.universe?` · ${S.universe}`:""}${cursed?" · Worst team wins!":""}</div>
      <button class="big c${p+1} display" id="roll">Roll character</button>
    </div>
  </div>`);
  document.getElementById("roll").onclick=()=>roll(p);
}

function roll(p){
  const pick=S.pool[S.turn]||S.pool[S.pool.length-1-S.turn]||shuffle([...CHARS])[0];
  // consume from pool positionally so rerenders don't re-roll
  const consumed=S.pool.splice(0,1)[0]||pick;
  $(`<div class="c${p+1}" style="display:contents">
    ${boardHTML(p)}
    <div class="center"><div class="card" style="width:100%">
      <div id="av"></div>
      <div class="cname display" id="nm"></div>
      <div class="csrc" id="sr">Rolling…</div>
    </div></div>
  </div>`);
  let n=0;
  const pool=S.universe?CHARS.filter(c=>c.source===S.universe):CHARS;
  const t=setInterval(()=>{
    const fake=pool[Math.random()*pool.length|0];
    av.innerHTML=avatarHTML(fake);nm.textContent=fake.name;sr.textContent=fake.source;
    if(++n>=16){clearInterval(t);av.innerHTML=avatarHTML(consumed);nm.textContent=consumed.name;sr.textContent=consumed.source;
      setTimeout(()=>assign(p,consumed),350);}
  },70);
}

function assign(p,ch){
  const cursed=S.mode==="cursed";
  $(`<div class="c${p+1}" style="display:contents">
    ${cursed?`<div class="curse-banner">💀 Pick where ${ch.name} fits WORST — you want low stats!</div>`:""}
    <div class="card">
      <div class="assign-row">
        ${avatarHTML(ch)}
        <div class="assign-info">
          <div class="cname display">${ch.name}</div>
          <div class="csrc">${ch.source}</div>
        </div>
      </div>
    </div>
    <div class="hint ${cursed?"curse-hint":""}">${pnLong(p)}: where does ${ch.name} fit ${cursed?"<b>worst</b>":"best"}?</div>
    <div class="picks">${CATS.map(c=>{const used=S.teams[p][c[0]];
      return `<button class="pick ${cursed?"curse-pick":""}" data-k="${c[0]}" ${used?"disabled":""}>
        <span class="icon">${c[2]}</span>
        <span class="label">${c[1]}</span>
      </button>`}).join("")}
    </div>
  </div>`);
  document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{
    S.teams[p][b.dataset.k]=ch;
    S.turn++;
    S.turn>=S.totalTurns?battle():turnScreen();
  });
}

/* ═══════════════════════════════
   BATTLE
═══════════════════════════════ */
function battle(){
  const cursed=S.mode==="cursed";
  const is4=S.numPlayers===4;

  // score tracker — array per player
  const wins=Array(S.numPlayers).fill(0);
  const totals=S.teams.map(t=>CATS.reduce((s,c)=>s+t[c[0]][c[0]],0));

  // pre-compute winners per category
  const catWinners=CATS.map(c=>{
    const vals=S.teams.map(t=>t[c[0]][c[0]]);
    const best=cursed?Math.min(...vals):Math.max(...vals);
    return vals.map(v=>v===best); // true = winner for that player
  });

  // score header
  const scoreSpans=S.teams.map((_,i)=>`<span class="c${i+1}" id="sc${i}" style="color:var(--p${i+1})">${pn(i)}: 0</span>`).join("");

  // row builder
  function rowHTML(ci){
    const c=CATS[ci];
    if(is4){
      // layout: [P1 side][P2 side][mid][P3 side][P4 side]
      const sides=S.teams.map((t,pi)=>{
        const ch=t[c[0]];
        const w=catWinners[ci][pi];
        return `<div class="side c${pi+1} ${w?"win":"lose"}">
          ${sideAvatarHTML(ch)}
          <div class="n">${pn(pi)}: ${ch.name}</div>
          <div class="num">${ch[c[0]]}</div>
        </div>`;
      });
      return `<div class="row p4" id="r${ci}">
        ${sides[0]}${sides[1]}
        <div class="mid"><span>${c[2]}</span>${c[1]}</div>
        ${sides[2]}${sides[3]}
      </div>`;
    } else {
      const a=S.teams[0][c[0]],b=S.teams[1][c[0]];
      const aw=catWinners[ci][0],bw=catWinners[ci][1];
      return `<div class="row p2" id="r${ci}">
        <div class="side c1 ${aw?"win":"lose"}">${sideAvatarHTML(a)}<div class="n">${a.name}</div><div class="num">${a[c[0]]}</div></div>
        <div class="mid"><span>${c[2]}</span>${c[1]}</div>
        <div class="side c2 ${bw?"win":"lose"}">${sideAvatarHTML(b)}<div class="n">${b.name}</div><div class="num">${b[c[0]]}</div></div>
      </div>`;
    }
  }

  $(`${cursed?`<div class="curse-banner" style="flex-shrink:0">💀 CURSED BATTLE — Lowest stat wins each category! 💀</div>`:`<div class="banner display" style="color:var(--gold);flex-shrink:0">${cursed?"Cursed Brawl!":"Battle!"}</div>`}
  <div class="score display">${scoreSpans}</div>
  <div class="battle-wrap">
    ${CATS.map((_,i)=>rowHTML(i)).join("")}
    <div class="final" id="final"></div>
  </div>`);

  CATS.forEach((c,i)=>{
    setTimeout(()=>{
      document.getElementById("r"+i).classList.add("show");
      catWinners[i].forEach((w,pi)=>{if(w)wins[pi]++;});
      S.teams.forEach((_,pi)=>{
        document.getElementById("sc"+pi).textContent=`${pn(pi)}: ${wins[pi]}`;
      });
    },1000+i*1500);
  });

  setTimeout(()=>{
    // find winner — most categories, tie-break by total (cursed: lowest total)
    const maxWins=Math.max(...wins);
    const topPlayers=wins.map((w,i)=>w===maxWins?i:-1).filter(i=>i>=0);
    let winner=-1;
    if(topPlayers.length===1){
      winner=topPlayers[0];
    } else {
      // tie-break
      const best=cursed?Math.min(...topPlayers.map(i=>totals[i])):Math.max(...topPlayers.map(i=>totals[i]));
      const tb=topPlayers.filter(i=>totals[i]===best);
      if(tb.length===1)winner=tb[0];
    }
    const winsStr=wins.map((w,i)=>`${pn(i)}: ${w}`).join(" · ");
    final.innerHTML=(winner<0
      ?`<div class="w display">It's a draw!</div>`
      :`<div class="w display c${winner+1}" style="color:var(--p${winner+1})">${pnLong(winner)} wins!</div>`)+
      `<div class="sub" style="font-size:1.2rem">${winsStr}</div>
      ${cursed?`<div style="font-size:1.2rem;color:var(--curse)">💀 Lowest stats won! 💀</div>`:""}
      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
        <button class="big display" id="again" style="padding:1rem 2.5rem;font-size:2rem">Play again</button>
        <button class="big ghost display" id="menu" style="font-size:1.6rem">Menu</button>
      </div>`;
    document.getElementById("again").onclick=()=>newGame(S.mode,S.universe);
    document.getElementById("menu").onclick=title;
    document.getElementById("final").scrollIntoView({behavior:"smooth",block:"nearest"});
  },1000+CATS.length*1500+300);
}

init();
</script>
</body>
</html>
